<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d0d0e">
  <title>BALDERAS Reward</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<main>

  <header>
    BALDERAS <span>Reward</span>
  </header>

  <section id="login" class="card">
    <h1>Panel del negocio</h1>
    <p class="muted">Acceso administrativo</p>

    <form id="form">
      <input id="email" type="email" placeholder="Correo" required>
      <input id="password" type="password" placeholder="Contraseña" required>
      <button>Iniciar sesión</button>
    </form>

    <p id="msg"></p>
  </section>

  <section id="app" hidden>

    <div class="top">
      <div>
        <h1 id="biz">LG ESTUDIO</h1>
        <small>BALDERAS Reward</small>
      </div>

      <button id="logout" class="secondary">Salir</button>
    </div>

    <div class="stats">
      <div>
        <b id="cc">—</b>
        <small>Clientes</small>
      </div>

      <div class="visitStat">
  <b id="vc">—</b>
  <small>Visitas</small>

  <select id="visitPeriod">
    <option value="today">Hoy</option>
    <option value="week">Esta semana</option>
    <option value="month">Este mes</option>
    <option value="total">Total</option>
  </select>
</div>

      <div>
        <b id="rc">—</b>
        <small>Recompensas</small>
      </div>
    </div>

    <section class="card">

      <div class="sectionhead">
        <h2>Clientes</h2>

        <button id="newClient" class="secondary compact">
          + Nuevo cliente
        </button>
      </div>

      <div id="customers"></div>

    </section>

    <section class="card">
  <h2>Recompensas</h2>
  <div id="rewards"></div>
</section>


<!-- PANEL SUPERADMIN BALDERAS -->

<section id="superAdminSection" class="card" hidden>

  <div class="sectionhead">
    <div>
      <h2>⚙️ BALDERAS Admin</h2>
      <p class="muted">
        Administración de la plataforma
      </p>
    </div>

    <span class="badge">
      SUPERADMIN
    </span>
  </div>

  <div class="adminMenu">

    <button
      id="manageBusinesses"
      class="secondary">
      🏢 Negocios
    </button>

    <button
      id="manageOwners"
      class="secondary">
      👤 Owners
    </button>

    <button
      id="createBusiness">
      + Nuevo negocio
    </button>

  </div>

</section>


<p id="status"></p>

  </section>

</main>

<dialog id="clientDialog">

  <form id="clientForm">

    <h2>Nuevo cliente</h2>

    <input
      id="clientName"
      placeholder="Nombre completo"
      required>

    <input
      id="clientPhone"
      placeholder="Teléfono (opcional)">

    <input
      id="clientEmail"
      type="email"
      placeholder="Correo (opcional)">

    <div class="actions">

      <button
        type="button"
        id="cancelClient"
        class="secondary">
        Cancelar
      </button>

      <button type="submit">
        Guardar
      </button>

    </div>

  </form>

</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
